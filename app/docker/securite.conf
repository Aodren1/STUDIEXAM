ServerTokens Prod
ServerSignature Off
TraceEnable Off
<FilesMatch "\.(html|css|js|svg|png|ico)$">
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "DENY"
  Header always set Referrer-Policy "same-origin"
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
  Header always set Cross-Origin-Opener-Policy "same-origin"
</FilesMatch>
<FilesMatch "\.html$">
  Header set Cache-Control "no-cache"
</FilesMatch>
# Les dossiers techniques ne sont jamais servis, même en cas d'erreur de DocumentRoot.
<DirectoryMatch "/(data|src|bin|tests)/">
  Require all denied
</DirectoryMatch>
